<script>
    let currentUser = JSON.parse(localStorage.getItem('kpi_user'));
    let currentWeek = getCurrentWeek();
    let planFactChart;

    function getCurrentWeek() {
        const date = new Date();
        date.setHours(0, 0, 0, 0);
        date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
        const week1 = new Date(date.getFullYear(), 0, 4);
        return 1 + Math.round(((date - week1) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
    }

    function setCurrentDate() {
        const days = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
        const months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
        const today = new Date();
        document.getElementById('current-date-display').innerText = `${days[today.getDay()]}, ${today.getDate()} ${months[today.getMonth()]}`;
    }

    function checkAuth() {
        if (currentUser) {
            document.getElementById('user-name').innerText = currentUser.name;
            if (currentUser.employee_id === ADMIN_ID) {
                document.getElementById('nav-admin-btn').classList.remove('hidden');
                document.getElementById('nav-admin-btn').classList.add('flex');
                document.getElementById('history-title').innerText = 'Записи всех сотрудников';
            } else {
                document.getElementById('nav-admin-btn').classList.add('hidden');
                document.getElementById('nav-admin-btn').classList.remove('flex');
                document.getElementById('history-title').innerText = 'Мои записи за неделю';
            }
            setCurrentDate();
            showScreen('dashboard');
        } else {
            showScreen('login');
        }
    }

    async function loginUser() {
        const empId = document.getElementById('login-id').value.trim();
        if (!empId) return alert('Введите табельный номер');

        const { data: usersData } = await sb.from('users').select('*').eq('employee_id', empId);
        const data = usersData && usersData.length > 0 ? usersData[0] : null;
        
        if (!data) {
            if (empId === ADMIN_ID) {
                const { data: newAdminData } = await sb.from('users').insert({ employee_id: empId, name: 'Администратор' }).select();
                currentUser = newAdminData[0];
            } else {
                return alert('Сотрудник не найден. Обратитесь к руководителю.');
            }
        } else {
            currentUser = data;
        }

        localStorage.setItem('kpi_user', JSON.stringify(currentUser));
        document.getElementById('user-name').innerText = currentUser.name;
        checkAuth();
    }

    function logout() {
        localStorage.removeItem('kpi_user');
        currentUser = null;
        showScreen('login');
    }

    function showScreen(screenName) {
        if (screenName === 'admin' && currentUser.employee_id !== ADMIN_ID) return alert('Доступ запрещен');

        ['login', 'dashboard', 'fact', 'admin'].forEach(s => document.getElementById('screen-' + s).classList.add('hidden'));
        document.getElementById('screen-' + screenName).classList.remove('hidden');
        document.getElementById('screen-' + screenName).classList.add('fade-in');

        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('text-indigo-600'));
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.add('text-gray-400'));
        const activeBtn = document.querySelector(`[data-screen="${screenName}"]`);
        if (activeBtn) {
            activeBtn.classList.add('text-indigo-600');
            activeBtn.classList.remove('text-gray-400');
        }

        if(screenName === 'dashboard') loadData();
        if(screenName === 'fact') loadHistory();
        if(screenName === 'admin') loadPlansList();
    }

    // Быстрое изменение значений кнопками +/-
    function changeVal(inputId, delta) {
        const input = document.getElementById(inputId);
        let newVal = (parseInt(input.value) || 0) + delta;
        if (newVal < 0) newVal = 0;
        input.value = newVal;
    }

    document.getElementById('current-week-display').innerText = currentWeek;
    document.getElementById('plan-week').value = currentWeek;

    // === АДМИН: ПЛАНЫ ===
    async function loadPlansList() {
        const { data: plans } = await sb.from('plans').select('*').order('week_number', { ascending: false });
        const list = document.getElementById('plans-list');
        if (!plans || plans.length === 0) {
            list.innerHTML = '<p class="text-gray-400 text-sm text-center py-4">Планов пока нет</p>';
            return;
        }
        list.innerHTML = plans.map(p => `
            <div class="bg-white p-4 rounded-2xl border border-gray-100 flex justify-between items-center shadow-sm">
                <div>
                    <p class="font-bold text-gray-800">Неделя ${p.week_number}</p>
                    <p class="text-gray-500 text-xs">${p.start_date ? new Date(p.start_date).toLocaleDateString('ru-RU') : '...'} - ${p.end_date ? new Date(p.end_date).toLocaleDateString('ru-RU') : '...'}</p>
                </div>
                <button onclick="editPlan(${p.id})" class="bg-gray-100 text-indigo-600 px-4 py-2 rounded-xl text-xs font-bold active:scale-95">Изменить</button>
            </div>
        `).join('');
    }

    async function editPlan(id) {
        const { data: p } = await sb.from('plans').select('*').eq('id', id).single();
        if (p) {
            document.getElementById('plan-form-title').innerText = 'Редактирование недели ' + p.week_number;
            document.getElementById('plan-id').value = p.id;
            document.getElementById('plan-week').value = p.week_number;
            document.getElementById('plan-start').value = p.start_date || '';
            document.getElementById('plan-end').value = p.end_date || '';
            document.getElementById('plan-sim').value = p.sim_plan;
            document.getElementById('plan-sub').value = p.sub_plan;
            document.getElementById('plan-merch').value = p.merch_plan;
            document.getElementById('plan-fin').value = p.fin_plan;
            document.getElementById('plan-acc').value = p.acc_plan;
            window.scrollTo(0, 0);
        }
    }

    function clearPlanForm() {
        document.getElementById('plan-form-title').innerText = 'Новый план';
        document.getElementById('plan-id').value = '';
        ['plan-week', 'plan-start', 'plan-end', 'plan-sim', 'plan-sub', 'plan-merch', 'plan-fin', 'plan-acc'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('plan-week').value = currentWeek;
    }

    async function submitPlan() {
        const planId = document.getElementById('plan-id').value;
        const planData = {
            week_number: parseInt(document.getElementById('plan-week').value),
            start_date: document.getElementById('plan-start').value || null,
            end_date: document.getElementById('plan-end').value || null,
            sim_plan: parseInt(document.getElementById('plan-sim').value) || 0,
            sub_plan: parseInt(document.getElementById('plan-sub').value) || 0,
            merch_plan: parseFloat(document.getElementById('plan-merch').value) || 0,
            fin_plan: parseFloat(document.getElementById('plan-fin').value) || 0,
            acc_plan: parseFloat(document.getElementById('plan-acc').value) || 0
        };

        let error;
        if (planId) {
            ({ error } = await sb.from('plans').update(planData).eq('id', planId));
        } else {
            ({ error } = await sb.from('plans').insert([planData]));
        }

        if (error) return alert('Ошибка: ' + error.message);
        alert(planId ? 'План обновлен!' : 'План сохранен!');
        clearPlanForm();
        loadPlansList();
    }

    async function addEmployee() {
        const name = document.getElementById('new-user-name').value.trim();
        const id = document.getElementById('new-user-id').value.trim();
        if (!name || !id) return alert('Заполните оба поля');
        const { error } = await sb.from('users').insert({ employee_id: id, name: name });
        if (error) return alert(error.code === '23505' ? 'Сотрудник уже существует!' : 'Ошибка: ' + error.message);
        alert('Сотрудник ' + name + ' добавлен!');
        document.getElementById('new-user-name').value = '';
        document.getElementById('new-user-id').value = '';
    }

    // === ЛОГИКА ДАННЫХ ===
    async function loadData() {
        const { data: plansData } = await sb.from('plans').select('*').eq('week_number', currentWeek);
        const plans = plansData && plansData.length > 0 ? plansData[0] : null;
        const { data: facts } = await sb.from('facts').select('*').eq('week_number', currentWeek);

        if (!plans) {
            document.getElementById('daily-targets').innerHTML = '<p class="text-red-400 text-center col-span-2 py-4">План на эту неделю не задан!</p>';
            document.getElementById('kpi-breakdown').innerHTML = '';
            return;
        }

        const totalFacts = { sim: 0, sub: 0, merch: 0, fin: 0, acc: 0 };
        const todayFacts = { sim: 0, sub: 0, merch: 0, fin: 0, acc: 0 };
        const todayStr = new Date().toLocaleDateString('ru-RU');

        facts.forEach(f => {
            totalFacts.sim += f.sim_fact;
            totalFacts.sub += f.sub_fact;
            totalFacts.merch += parseFloat(f.merch_fact);
            totalFacts.fin += parseFloat(f.fin_fact);
            totalFacts.acc += parseFloat(f.acc_fact);

            const factDate = new Date(f.created_at).toLocaleDateString('ru-RU');
            if (factDate === todayStr) {
                todayFacts.sim += f.sim_fact;
                todayFacts.sub += f.sub_fact;
                todayFacts.merch += parseFloat(f.merch_fact);
                todayFacts.fin += parseFloat(f.fin_fact);
                todayFacts.acc += parseFloat(f.acc_fact);
            }
        });

        const workDaysTotal = 5;
        const metrics = [
            { name: 'SIM', plan: plans.sim_plan, fact: totalFacts.sim, todayFact: todayFacts.sim, color: 'bg-indigo-500' },
            { name: 'Абонем.', plan: plans.sub_plan, fact: totalFacts.sub, todayFact: todayFacts.sub, color: 'bg-purple-500' },
            { name: 'Товарооб.', plan: plans.merch_plan, fact: totalFacts.merch, todayFact: todayFacts.merch, color: 'bg-blue-500' },
            { name: 'Финуслуги', plan: plans.fin_plan, fact: totalFacts.fin, todayFact: todayFacts.fin, color: 'bg-green-500' },
            { name: 'Аксессуары', plan: plans.acc_plan, fact: totalFacts.acc, todayFact: todayFacts.acc, color: 'bg-teal-500' }
        ];

        // Отрисовка Плана на сегодня
        let dailyHTML = '';
        metrics.forEach(m => {
            const dailyPlan = m.plan / workDaysTotal;
            const progress = dailyPlan > 0 ? Math.min((m.todayFact / dailyPlan) * 100, 100) : 0;
            dailyHTML += `
                <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
                    <p class="text-xs text-gray-500 font-medium">${m.name}</p>
                    <div class="flex items-baseline gap-1 mt-1">
                        <span class="text-xl font-bold text-gray-900">${m.todayFact}</span>
                        <span class="text-xs text-gray-400">/ ${dailyPlan.toFixed(0)}</span>
                    </div>
                    <div class="w-full bg-gray-100 rounded-full h-1.5 mt-2">
                        <div class="${m.color} h-1.5 rounded-full transition-all duration-500" style="width: ${progress}%"></div>
                    </div>
                </div>
            `;
        });
        document.getElementById('daily-targets').innerHTML = dailyHTML;

        // Расчет KPI
        const today = new Date().getDay(); 
        const workDaysPassed = today === 0 ? 5 : Math.min(today, 5);
        let totalKpi = 0, forecastKpi = 0, allMaxedOut = true, allMaxedOutFc = true;
        let breakdownHTML = '', chartLabels = [], chartPlan = [], chartFact = [], chartForecast = [];

        metrics.forEach(m => {
            let percent = m.plan > 0 ? (m.fact / m.plan) * 100 : 0;
            let calcPercent = percent, displayPercent = percent.toFixed(0);
            let statusColor = 'text-gray-500', statusText = '';
            let forecastFact = workDaysPassed > 0 ? (m.fact / workDaysPassed) * workDaysTotal : 0;
            let fcPercent = m.plan > 0 ? (forecastFact / m.plan) * 100 : 0;
            let calcFcPercent = fcPercent;

            if (percent < 70) { calcPercent = 0; statusColor = 'text-red-500 font-bold'; statusText = '(обнуление)'; allMaxedOut = false; }
            else if (percent > 150) { calcPercent = 150; displayPercent = '150'; statusColor = 'text-blue-500 font-bold'; statusText = '(потолок)'; }
            else { allMaxedOut = false; }

            if (fcPercent < 70) { calcFcPercent = 0; allMaxedOutFc = false; }
            else if (fcPercent > 150) { calcFcPercent = 150; }
            else { allMaxedOutFc = false; }

            totalKpi += calcPercent; forecastKpi += calcFcPercent;

            breakdownHTML += `<div class="flex justify-between items-center"><span class="text-gray-600">${m.name}</span><span class="${statusColor}">${displayPercent}% (Прогн: ${fcPercent.toFixed(0)}%) ${statusText}</span></div>`;
            chartLabels.push(m.name); chartPlan.push(m.plan); chartFact.push(m.fact); chartForecast.push(Math.round(forecastFact));
        });

        totalKpi = totalKpi / metrics.length; forecastKpi = forecastKpi / metrics.length;
        if (allMaxedOut) totalKpi = 200; else if (totalKpi < 70) totalKpi = 70;
        if (allMaxedOutFc) forecastKpi = 200; else if (forecastKpi < 70) forecastKpi = 70;

        document.getElementById('kpi-breakdown').innerHTML = breakdownHTML;
        document.getElementById('kpi-main-value').innerText = (totalKpi / 100).toFixed(2);
        document.getElementById('kpi-forecast').innerText = (forecastKpi / 100).toFixed(2);
        document.getElementById('kpi-progress').style.width = Math.min(totalKpi / 2, 100) + '%';
        
        // Мотивационный текст
        let motivText = 'Продолжай в том же духе!';
        if (totalKpi < 80) motivText = 'Нужно поднажать, время еще есть!';
        else if (totalKpi > 120) motivText = 'Отличная работа! Так держать!';
        document.getElementById('motivation-text').innerText = motivText;

        updateChart(chartLabels, chartPlan, chartFact, chartForecast);
    }

    function updateChart(labels, plan, fact, forecast) {
        const ctx = document.getElementById('planFactChart').getContext('2d');
        if (planFactChart) planFactChart.destroy();
        planFactChart = new Chart(ctx, {
            type: 'bar',
            data: { labels: labels, datasets: [
                { label: 'План', data: plan, backgroundColor: '#e5e7eb', borderRadius: 4 },
                { label: 'Факт', data: fact, backgroundColor: '#6366f1', borderRadius: 4 },
                { label: 'Прогноз', data: forecast, backgroundColor: '#a78bfa', borderRadius: 4 }
            ]},
            options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } }, scales: { y: { beginAtZero: true, ticks: { font: { size: 10 } } }, x: { ticks: { font: { size: 10 } } } } }
        });
    }

    // === ВВОД ФАКТОВ ===
    async function submitFact() {
        const factId = document.getElementById('fact-id').value;
        const factData = {
            week_number: currentWeek,
            employee_id: currentUser.employee_id,
            sim_fact: parseInt(document.getElementById('fact-sim').value) || 0,
            sub_fact: parseInt(document.getElementById('fact-sub').value) || 0,
            merch_fact: parseFloat(document.getElementById('fact-merch').value) || 0,
            fin_fact: parseFloat(document.getElementById('fact-fin').value) || 0,
            acc_fact: parseFloat(document.getElementById('fact-acc').value) || 0
        };

        if (factId) factData.edited_by = currentUser.name;

        let error;
        if (factId) {
            ({ error } = await sb.from('facts').update(factData).eq('id', factId));
        } else {
            ({ error } = await sb.from('facts').insert([factData]));
        }

        if (error) return alert('Ошибка: ' + error.message);
        alert(factId ? 'Обновлено!' : 'Сохранено!');
        clearFactForm();
        loadHistory();
    }

    function clearFactForm() {
        document.getElementById('fact-id').value = '';
        document.getElementById('fact-sim').value = 0;
        document.getElementById('fact-sub').value = 0;
        ['fact-merch', 'fact-fin', 'fact-acc'].forEach(id => document.getElementById(id).value = '');
    }

    async function loadHistory() {
        let query = sb.from('facts').select('*').eq('week_number', currentWeek);
        if (currentUser.employee_id !== ADMIN_ID) {
            query = query.eq('employee_id', currentUser.employee_id);
        }

        const { data: facts } = await query.order('created_at', { ascending: false });
        const list = document.getElementById('history-list');
        const { data: users } = await sb.from('users').select('*');
        const userMap = {}; users.forEach(u => userMap[u.employee_id] = u.name);

        if (!facts || facts.length === 0) {
            list.innerHTML = '<p class="text-gray-400 text-sm text-center py-4">Записей пока нет</p>';
            return;
        }

        list.innerHTML = facts.map(f => {
            const empName = currentUser.employee_id === ADMIN_ID ? `<span class="font-bold text-indigo-600">${userMap[f.employee_id] || 'Неизвестный'}</span><br>` : '';
            const edited = f.edited_by ? ` <span class="text-orange-500 text-xs">(ред. ${f.edited_by})</span>` : '';
            return `
            <div class="bg-white p-4 rounded-2xl border border-gray-100 flex justify-between items-center shadow-sm">
                <div class="text-sm">
                    <p class="text-gray-500 text-xs">${new Date(f.created_at).toLocaleDateString('ru-RU')} ${edited}</p>
                    ${empName}
                    <p class="mt-1">Сим: ${f.sim_fact}, Абон: ${f.sub_fact}<br>Тов: ${f.merch_fact}₽, Фин: ${f.fin_fact}₽, Акс: ${f.acc_fact}₽</p>
                </div>
                <div class="flex flex-col gap-2">
                    <button onclick="editFact(${f.id})" class="bg-gray-100 text-indigo-600 px-3 py-1 rounded-lg text-xs font-bold">Изменить</button>
                    <button onclick="deleteFact(${f.id})" class="bg-gray-100 text-red-500 px-3 py-1 rounded-lg text-xs font-bold">Удалить</button>
                </div>
            </div>`;
        }).join('');
    }

    async function editFact(id) {
        const { data: factData } = await sb.from('facts').select('*').eq('id', id);
        const f = factData && factData.length > 0 ? factData[0] : null;
        if (f) {
            document.getElementById('fact-id').value = f.id;
            document.getElementById('fact-sim').value = f.sim_fact;
            document.getElementById('fact-sub').value = f.sub_fact;
            document.getElementById('fact-merch').value = f.merch_fact;
            document.getElementById('fact-fin').value = f.fin_fact;
            document.getElementById('fact-acc').value = f.acc_fact;
            window.scrollTo(0, 0);
        }
    }

    async function deleteFact(id) {
        if (!confirm('Удалить эту запись?')) return;
        await sb.from('facts').delete().eq('id', id);
        loadHistory();
    }

    checkAuth();
</script>
</body>
</html>
