<script>
    // --- УПРАВЛЕНИЕ ЭКРАНАМИ И АВТОРИЗАЦИЯ ---
    let currentUser = JSON.parse(localStorage.getItem('kpi_user'));
    let currentWeek = getCurrentWeek();
    let planFactChart;

    function getCurrentWeek() {
        const date = new Date();
        date.setHours(0, 0, 0, 0);
        date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
        const week1 = new Date(date.getFullYear(), 0, 4);
        return 1 + Math.round(((date - week1) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
    }

    function checkAuth() {
        if (currentUser) {
            document.getElementById('user-name').innerText = currentUser.name;
            showScreen('dashboard');
        } else {
            showScreen('login');
        }
    }

    async function loginUser() {
        const empId = document.getElementById('login-id').value.trim();
        if (!empId) return alert('Введите табельный номер');

        // Ищем пользователя в базе
        const { data, error } = await supabase.from('users').select('*').eq('employee_id', empId).single();
        
        if (error || !data) {
            // Если нет, создаем нового (в реальном админке их бы создавал HR, тут для простоты автосоздание)
            const { data: newUser, error: insertError } = await supabase
                .from('users')
                .insert({ employee_id: empId, name: 'Сотрудник ' + empId })
                .select()
                .single();
            
            if (insertError) return alert('Ошибка авторизации');
            currentUser = newUser;
        } else {
            currentUser = data;
        }

        localStorage.setItem('kpi_user', JSON.stringify(currentUser));
        document.getElementById('user-name').innerText = currentUser.name;
        showScreen('dashboard');
    }

    function logout() {
        localStorage.removeItem('kpi_user');
        currentUser = null;
        showScreen('login');
    }

    function showScreen(screenName) {
        ['login', 'dashboard', 'fact', 'admin'].forEach(s => {
            document.getElementById('screen-' + s).classList.add('hidden');
        });
        document.getElementById('screen-' + screenName).classList.remove('hidden');
        document.getElementById('screen-' + screenName).classList.add('fade-in');

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.classList.remove('text-indigo-600');
            btn.classList.add('text-gray-400');
        });
        const activeBtn = document.querySelector(`[data-screen="${screenName}"]`);
        if (activeBtn) {
            activeBtn.classList.add('text-indigo-600');
            activeBtn.classList.remove('text-gray-400');
        }

        if(screenName === 'dashboard') loadData();
        if(screenName === 'fact') loadHistory();
    }

    // --- ЛОГИКА ДАННЫХ ---
    document.getElementById('current-week-display').innerText = currentWeek;
    document.getElementById('plan-week').value = currentWeek;

    async function loadData() {
        const { data: plans } = await supabase.from('plans').select('*').eq('week_number', currentWeek).single();
        const { data: facts } = await supabase.from('facts').select('*').eq('week_number', currentWeek);

        if (!plans) {
            document.getElementById('kpi-breakdown').innerHTML = '<p class="text-red-400 text-center">Админ не задал план!</p>';
            return;
        }

        const totalFacts = { sim: 0, sub: 0, merch: 0, fin: 0, acc: 0 };
        facts.forEach(f => {
            totalFacts.sim += f.sim_fact;
            totalFacts.sub += f.sub_fact;
            totalFacts.merch += parseFloat(f.merch_fact);
            totalFacts.fin += parseFloat(f.fin_fact);
            totalFacts.acc += parseFloat(f.acc_fact);
        });

        // Прогноз: считаем прошедшие дни (Пн=1, Вс=7). Рабочих 5.
        const today = new Date().getDay(); 
        const workDaysPassed = today === 0 ? 5 : Math.min(today, 5); // Если воскресенье, считаем что неделя прошла
        const workDaysTotal = 5;

        const metrics = [
            { name: 'SIM', plan: plans.sim_plan, fact: totalFacts.sim },
            { name: 'Абонем.', plan: plans.sub_plan, fact: totalFacts.sub },
            { name: 'Товарооб.', plan: plans.merch_plan, fact: totalFacts.merch },
            { name: 'Финуслуги', plan: plans.fin_plan, fact: totalFacts.fin },
            { name: 'Аксессуары', plan: plans.acc_plan, fact: totalFacts.acc }
        ];

        let totalKpi = 0, forecastKpi = 0, allMaxedOut = true, allMaxedOutFc = true;
        let breakdownHTML = '', dailyTargetHTML = '';
        let chartLabels = [], chartPlan = [], chartFact = [], chartForecast = [];

        metrics.forEach(m => {
            // Текущий %
            let percent = m.plan > 0 ? (m.fact / m.plan) * 100 : 0;
            let calcPercent = percent, displayPercent = percent.toFixed(0);
            let statusColor = 'text-gray-500', statusText = '';

            // Прогноз %
            let forecastFact = workDaysPassed > 0 ? (m.fact / workDaysPassed) * workDaysTotal : 0;
            let fcPercent = m.plan > 0 ? (forecastFact / m.plan) * 100 : 0;
            let calcFcPercent = fcPercent;

            // Применяем правила KPI (текущий)
            if (percent < 70) { calcPercent = 0; statusColor = 'text-red-500 font-bold'; statusText = '(обнуление)'; allMaxedOut = false; }
            else if (percent > 150) { calcPercent = 150; displayPercent = '150'; statusColor = 'text-blue-500 font-bold'; statusText = '(потолок)'; }
            else { allMaxedOut = false; }

            // Применяем правила KPI (прогноз)
            if (fcPercent < 70) { calcFcPercent = 0; allMaxedOutFc = false; }
            else if (fcPercent > 150) { calcFcPercent = 150; }
            else { allMaxedOutFc = false; }

            totalKpi += calcPercent;
            forecastKpi += calcFcPercent;

            breakdownHTML += `<div class="flex justify-between"><span>${m.name}</span><span class="${statusColor}">${displayPercent}% (Прогноз: ${fcPercent.toFixed(0)}%) ${statusText}</span></div>`;
            
            // План на день (для шапки)
            const dailyVal = m.plan > 0 ? (m.plan / workDaysTotal).toFixed(0) : 0;
            dailyTargetHTML += `${m.name}: ${dailyVal} / `;

            // Данные для графика
            chartLabels.push(m.name);
            chartPlan.push(m.plan);
            chartFact.push(m.fact);
            chartForecast.push(Math.round(forecastFact));
        });

        totalKpi = totalKpi / metrics.length;
        forecastKpi = forecastKpi / metrics.length;

        if (allMaxedOut) totalKpi = 200; else if (totalKpi < 70) totalKpi = 70;
        if (allMaxedOutFc) forecastKpi = 200; else if (forecastKpi < 70) forecastKpi = 70;

        document.getElementById('kpi-breakdown').innerHTML = breakdownHTML;
        document.getElementById('kpi-main-value').innerText = (totalKpi / 100).toFixed(2);
        document.getElementById('kpi-forecast').innerText = (forecastKpi / 100).toFixed(2);
        document.getElementById('daily-target').innerText = dailyTargetHTML.slice(0, -2); // Убираем последнюю запятую
        document.getElementById('kpi-progress').style.width = Math.min(totalKpi / 2, 100) + '%';

        updateChart(chartLabels, chartPlan, chartFact, chartForecast);
    }

    function updateChart(labels, plan, fact, forecast) {
        const ctx = document.getElementById('planFactChart').getContext('2d');
        if (planFactChart) planFactChart.destroy();
        planFactChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    { label: 'План', data: plan, backgroundColor: '#e5e7eb', borderRadius: 4 },
                    { label: 'Факт', data: fact, backgroundColor: '#6366f1', borderRadius: 4 },
                    { label: 'Прогноз', data: forecast, backgroundColor: '#a78bfa', borderRadius: 4 }
                ]
            },
            options: { responsive: true, plugins: { legend: { position: 'bottom' } }, scales: { y: { beginAtZero: true } } }
        });
    }

    // --- ВВОД И РЕДАКТИРОВАНИЕ ФАКТОВ ---
    async function submitFact() {
        const factId = document.getElementById('fact-id').value;
        const factData = {
            week_number: currentWeek,
            employee_id: currentUser.employee_id,
            sim_fact: parseInt(document.getElementById('fact-sim').value) || 0,
            sub_fact: parseInt(document.getElementById('fact-sub').value) || 0,
            merch_fact: parseFloat(document.getElementById('fact-merch').value) || 0,
            fin_fact: parseFloat(document.getElementById('fact-fin').value) || 0,
            acc_fact: parseFloat(document.getElementById('fact-acc').value) || 0
        };

        let error;
        if (factId) {
            // Редактирование
            ({ error } = await supabase.from('facts').update(factData).eq('id', factId));
        } else {
            // Новый факт
            ({ error } = await supabase.from('facts').insert([factData]));
        }

        if (error) return alert('Ошибка: ' + error.message);
        alert(factId ? 'Обновлено!' : 'Сохранено!');
        clearFactForm();
        loadHistory();
    }

    function clearFactForm() {
        document.getElementById('fact-id').value = '';
        ['fact-sim', 'fact-sub', 'fact-merch', 'fact-fin', 'fact-acc'].forEach(id => document.getElementById(id).value = '');
    }

    async function loadHistory() {
        const { data: facts } = await supabase.from('facts').select('*').eq('employee_id', currentUser.employee_id).eq('week_number', currentWeek);
        const list = document.getElementById('history-list');
        
        if (!facts || facts.length === 0) {
            list.innerHTML = '<p class="text-gray-400 text-sm text-center">Записей пока нет</p>';
            return;
        }

        list.innerHTML = facts.map(f => `
            <div class="bg-white p-3 rounded-xl flex justify-between items-center card-shadow">
                <div class="text-sm">
                    <p class="text-gray-500">${new Date(f.created_at).toLocaleDateString()}</p>
                    <p>Сим: ${f.sim_fact}, Абон: ${f.sub_fact}</p>
                </div>
                <div class="flex gap-2">
                    <button onclick="editFact(${f.id})" class="text-indigo-600 text-xs font-bold">Изменить</button>
                    <button onclick="deleteFact(${f.id})" class="text-red-500 text-xs font-bold">Удалить</button>
                </div>
            </div>
        `).join('');
    }

    async function editFact(id) {
        const { data: f } = await supabase.from('facts').select('*').eq('id', id).single();
        if (f) {
            document.getElementById('fact-id').value = f.id;
            document.getElementById('fact-sim').value = f.sim_fact;
            document.getElementById('fact-sub').value = f.sub_fact;
            document.getElementById('fact-merch').value = f.merch_fact;
            document.getElementById('fact-fin').value = f.fin_fact;
            document.getElementById('fact-acc').value = f.acc_fact;
            window.scrollTo(0, 0);
        }
    }

    async function deleteFact(id) {
        if (!confirm('Удалить эту запись?')) return;
        await supabase.from('facts').delete().eq('id', id);
        loadHistory();
    }

    async function submitPlan() {
        const plan = {
            week_number: parseInt(document.getElementById('plan-week').value),
            sim_plan: parseInt(document.getElementById('plan-sim').value) || 0,
            sub_plan: parseInt(document.getElementById('plan-sub').value) || 0,
            merch_plan: parseFloat(document.getElementById('plan-merch').value) || 0,
            fin_plan: parseFloat(document.getElementById('plan-fin').value) || 0,
            acc_plan: parseFloat(document.getElementById('plan-acc').value) || 0
        };
        const { error } = await supabase.from('plans').insert([plan]);
        if (error) alert('Ошибка: ' + error.message);
        else alert('План сохранен!');
    }

    // --- ПУШ-УВЕДОМЛЕНИЯ ---
    function setupNotifications() {
        if (!('Notification' in window)) return;
        // В 17:00 напоминаем
        const now = new Date();
        const target = new Date();
        target.setHours(17, 0, 0, 0);
        if (now > target) target.setDate(target.getDate() + 1); // Если уже после 17, на завтра
        
        const msToTarget = target - now;
        
        setTimeout(() => {
            if (Notification.permission === 'granted') {
                new Notification('План-Факт Контроль', { body: 'Не забудь внести продажи за сегодня!' });
            }
            // Перезапускаем на следующий день (грубо, для PWA хватает)
            setInterval(() => {
                if (Notification.permission === 'granted') {
                    new Notification('План-Факт Контроль', { body: 'Не забудь внести продажи за сегодня!' });
                }
            }, 24 * 60 * 60 * 1000);
        }, msToTarget);
    }

    // Запрос разрешения на пуши при первом входе
    if (currentUser) {
        if (Notification.permission === 'default') {
            Notification.requestPermission().then(p => { if (p === 'granted') setupNotifications(); });
        } else if (Notification.permission === 'granted') {
            setupNotifications();
        }
    }

    // СТАРТ
    checkAuth();
</script>
</body>
</html>
